<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>100 dias </title>
  <link rel="icon" href="https://twemoji.maxcdn.com/v/latest/72x72/1f9f8.png" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Fundo decorativo -->
  <div class="bg-decor">
        <span class="bear b1">
      <svg viewBox="0 0 100 100" class="bear-svg"><circle cx="28" cy="22" r="11"/><circle cx="72" cy="22" r="11"/><circle cx="50" cy="48" r="32"/><circle cx="38" cy="44" r="3.5" fill="#fff"/><circle cx="62" cy="44" r="3.5" fill="#fff"/><ellipse cx="50" cy="55" rx="7" ry="5" fill="#fff"/><circle cx="50" cy="52" r="2.5" fill="currentColor"/></svg>
    </span>
    <span class="bear b2">
      <svg viewBox="0 0 100 100" class="bear-svg"><circle cx="28" cy="22" r="11"/><circle cx="72" cy="22" r="11"/><circle cx="50" cy="48" r="32"/><circle cx="38" cy="44" r="3.5" fill="#fff"/><circle cx="62" cy="44" r="3.5" fill="#fff"/><ellipse cx="50" cy="55" rx="7" ry="5" fill="#fff"/><circle cx="50" cy="52" r="2.5" fill="currentColor"/></svg>
    </span>
    <span class="cloud c1">☁️</span>
    <span class="cloud c2">☁️</span>
    <span class="star s1">✨</span>
    <span class="star s2">✨</span>
  </div>

  <!-- TELA DA CONTAGEM REGRESSIVA -->
  <main id="countdown-view" class="container">
    <p class="eyebrow">18 de agosto → 25 de novembro</p>
    <h1 class="title">Nossa contagem <span>de 100 dias</span> </h1>
    <p class="subtitle">Cada dia mais perto de nós dois</p>

    <div class="countdown" id="countdown" data-target="2026-11-25T00:00:00">
      <div class="time-box">
        <span class="number" id="days">00</span>
        <span class="label">dias</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">horas</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">min</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">seg</span>
      </div>
    </div>

    <p class="footer-msg">Alguns dias a menos, algumas vontades a mais ... </p>
  </main>

  <!-- TELA DO DIA FINAL (fica escondida até acabar a contagem) -->
  <main id="final-view" class="container final hidden">
    <canvas id="confetti-canvas"></canvas>
    <div class="final-content">
            <span class="final-bear">
        <svg viewBox="0 0 100 100" class="bear-svg final-bear-svg"><circle cx="28" cy="22" r="11"/><circle cx="72" cy="22" r="11"/><circle cx="50" cy="48" r="32"/><circle cx="38" cy="44" r="3.5" fill="#fff"/><circle cx="62" cy="44" r="3.5" fill="#fff"/><ellipse cx="50" cy="55" rx="7" ry="5" fill="#fff"/><circle cx="50" cy="52" r="2.5" fill="currentColor"/></svg>
      </span>
      <h1 class="final-title">O DIA</h1>
      <p class="final-subtitle">É HOJE!! rsrs ✨</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
